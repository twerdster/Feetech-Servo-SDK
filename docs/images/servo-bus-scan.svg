<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Feetech servo SDK bus scan (abstract diagram)</title>
  <desc id="desc">Abstract diagram, not a photo or test result: a Python program using scservo_sdk opens a serial port through pyserial, sets the baud rate and pings servo IDs 1 to 253 on a shared serial servo bus, collecting the IDs and model numbers that answer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .h { font-size: 17px; font-weight: 700; }
    .t { font-size: 13px; }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #374151; }
    .note { font-size: 12px; fill: #6b7280; font-style: italic; }
    .flow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="330" fill="#ffffff"/>
  <text x="24" y="34" class="h" style="font-size:20px">Feetech SCServo SDK: scanning a serial servo bus</text>
  <text x="936" y="34" class="note" text-anchor="end">Abstract diagram, not a photo or test result</text>

  <!-- Host -->
  <rect x="24" y="66" width="300" height="196" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="174" y="94" class="h" text-anchor="middle">Python program</text>
  <text x="44" y="122" class="m">from scservo_sdk import *</text>
  <text x="44" y="148" class="m">PortHandler(device)</text>
  <text x="44" y="168" class="m">PacketHandler(protocol)</text>
  <text x="44" y="188" class="m">packetHandler.ping(port, id)</text>
  <text x="44" y="218" class="t">protocol 0: STS/SMS · 1: SCS</text>
  <text x="44" y="240" class="t">serial access via pyserial</text>

  <!-- Adapter -->
  <rect x="380" y="100" width="170" height="128" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="465" y="128" class="h" text-anchor="middle">Serial port</text>
  <text x="465" y="152" class="m" text-anchor="middle">/dev/ttyUSB0</text>
  <text x="465" y="170" class="m" text-anchor="middle">COM1 …</text>
  <text x="465" y="198" class="t" text-anchor="middle">default 1,000,000 baud</text>

  <path d="M324,164 L376,164" class="flow"/>

  <!-- Bus -->
  <path d="M550,164 L930,164" stroke="#b45309" stroke-width="3" fill="none"/>
  <text x="740" y="152" class="t" text-anchor="middle" style="fill:#92400e">shared servo bus</text>
  <g>
    <line x1="610" y1="164" x2="610" y2="196" stroke="#b45309" stroke-width="2"/>
    <rect x="580" y="196" width="60" height="44" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="610" y="223" class="m" text-anchor="middle">ID 1</text>
    <line x1="700" y1="164" x2="700" y2="196" stroke="#b45309" stroke-width="2"/>
    <rect x="670" y="196" width="60" height="44" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="700" y="223" class="m" text-anchor="middle">ID 2</text>
    <line x1="790" y1="164" x2="790" y2="196" stroke="#b45309" stroke-width="2"/>
    <rect x="760" y="196" width="60" height="44" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="790" y="223" class="m" text-anchor="middle">ID 3</text>
    <text x="840" y="223" class="t" text-anchor="middle">…</text>
    <line x1="894" y1="164" x2="894" y2="196" stroke="#b45309" stroke-width="2"/>
    <rect x="858" y="196" width="72" height="44" rx="6" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="894" y="223" class="m" text-anchor="middle">ID 253</text>
  </g>
  <text x="755" y="96" class="t" text-anchor="middle">ping.py scans IDs --id_start … --id_end</text>
  <text x="755" y="116" class="t" text-anchor="middle">and lists responding IDs with model numbers</text>

  <text x="24" y="296" class="note">Based on scservo_sdk/ and scsservo_sdk_example/ping.py. It shows how the SDK addresses servos and</text>
  <text x="24" y="314" class="note">does not record which servos were attached. Wiring and power depend on your adapter and servos.</text>
</svg>
